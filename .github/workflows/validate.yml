name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  root-validation:
    name: Root validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check working tree whitespace
        run: git diff --check

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check dispatched commit whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^..HEAD

      - name: Root TypeScript baseline (informational; expected to fail)
        continue-on-error: true
        run: pnpm check

  worker-validation:
    name: Event API Worker validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/event-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # This subproject's pnpm-workspace.yaml uses allowBuilds, which requires pnpm 10+.
          version: 11.5.1
          package_json_file: workers/event-api/package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: workers/event-api/pnpm-lock.yaml

      - name: Install Worker dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Worker
        run: pnpm exec tsc --noEmit
