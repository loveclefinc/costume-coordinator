<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensemble AI — Build Week video renderer</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0e1524; color: #fff; display: grid; place-items: center; }
      main { width: min(96vw, 1320px); padding: 24px; }
      .toolbar { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; background: #e2667b; color: #fff; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { color: #cbd5e1; }
      canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: #111827; border-radius: 18px; box-shadow: 0 28px 80px #0008; }
      progress { width: 100%; height: 8px; margin-top: 14px; accent-color: #e2667b; }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <button id="render">Render submission video</button>
        <span id="status">Loading timeline…</span>
      </div>
      <canvas id="stage" width="1280" height="720"></canvas>
      <progress id="progress" value="0" max="1"></progress>
    </main>
    <script type="module" src="/render.js"></script>
  </body>
</html>
